name: Release

# Tagging a version builds the plugin and publishes the release from that build,
# rather than from whatever main.js happened to be on someone's laptop. The
# attestation step is what lets a reader verify that the main.js they are about
# to run was produced by this workflow, from this repository, at this commit —
# the check Obsidian's directory asks for under "artifact attestations".
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # mint the signing identity for the attestation
  attestations: write  # record the attestation against this repository

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Check the tag matches manifest.json
        # A release tagged 0.1.1 that ships a manifest saying 0.1.0 installs as
        # 0.1.0 and never updates again. Fail here instead.
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag $TAG does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Attest the built assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json
